name: ZiroEdge
options:
  bundleIdPrefix: com.zanish-labs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  SwiftLlama:
    path: Packages/swift-llama-cpp

targets:
  ZiroEdge:
    type: application
    platform: iOS
    sources:
      - path: ZiroEdge
        excludes:
          - "**/*.xcassets"
      - path: ZiroEdge/Resources/Assets.xcassets
    # Branded launch screen (spec §Launch): xcodegen writes Config/Info.plist
    # with the UILaunchScreen dictionary referencing the LaunchBackground
    # colorset (universal #F7F3EC, dark #151210) and the AppLogo imageset
    # (the ZE logo). ModelCatalogVersion is
    # carried here so the generated plist keeps its existing key. When the
    # project is regenerated, the explicit plist dict wins over generated
    # keys (GENERATE_INFOPLIST_FILE merges the file) — so the launch screen
    # renders the logo over the warm-paper/graphite background instead of
    # a bare black.
    info:
      path: Config/Info.plist
      properties:
        ModelCatalogVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: AppLogo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanish-labs.ziroedge
        # Register the amber AccentColor colorset as the app-wide accent so
        # `Color.accentColor` (primary buttons, user bubbles, focus rings,
        # chips, links) resolves to the brand asset instead of system blue
        # (design spec §3.4).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 36V92GAJBT
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
    entitlements:
      path: ZiroEdge/ZiroEdge.entitlements
      properties: {}

  ZiroEdgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZiroEdgeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanish-labs.ziroedge.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 36V92GAJBT
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: ZiroEdge
      - package: SwiftLlama
        product: SwiftLlama

  ZiroEdgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZiroEdgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zanish-labs.ziroedge.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 36V92GAJBT
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: ZiroEdge

schemes:
  ZiroEdge:
    build:
      targets:
        ZiroEdge: all
        ZiroEdgeTests: [test]
    test:
      targets:
        - ZiroEdgeTests
  ZiroEdgeUITests:
    build:
      targets:
        ZiroEdge: all
        ZiroEdgeUITests: [test]
    test:
      targets:
        - ZiroEdgeUITests
